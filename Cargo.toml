[package]
name = "tempo-webhooks"
version = "0.1.0"
edition = "2021"

[dependencies]
# Blockchain
alloy = { version = "0.6", features = ["providers", "rpc-types", "transports", "node-bindings", "contract", "signers"] }

# Web server
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Message queue
async-nats = "0.35"

# HTTP client (for webhooks)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto (for HMAC signatures)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Retry logic
backoff = "0.4"

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
regex = "1.10"

# Environment variables
envy = "0.4"

# Lazy static
lazy_static = "1.4"

# JWT
jsonwebtoken = "9.2"

# Rate limiting
governor = "0.6"

# Password hashing
bcrypt = "0.15"
sentry = "0.46.2"

[dev-dependencies]
tokio-test = "0.4"
